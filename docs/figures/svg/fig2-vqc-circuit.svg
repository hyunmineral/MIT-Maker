<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="38" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1a2e">Figure 2. VQC policy circuit (6 qubits · 4 layers · 72 parameters)</text>
  <text x="500" y="64" font-size="13" text-anchor="middle" fill="#6b7280">Simulated as a state vector on classical FPGA fabric — not real quantum hardware</text>

  <!-- stage labels -->
  <rect x="150" y="86" width="150" height="26" rx="4" fill="#dbeafe"/>
  <text x="225" y="104" font-size="13" font-weight="700" text-anchor="middle" fill="#1e40af">① Angle encoding</text>
  <rect x="312" y="86" width="396" height="26" rx="4" fill="#fce7f3"/>
  <text x="510" y="104" font-size="13" font-weight="700" text-anchor="middle" fill="#9d174d">② Variational layers (trainable parameters θ)</text>
  <rect x="720" y="86" width="150" height="26" rx="4" fill="#dcfce7"/>
  <text x="795" y="104" font-size="12" font-weight="700" text-anchor="middle" fill="#166534">③ Entangle + measure</text>

  <!-- qubit lines -->
  <g stroke="#374151" stroke-width="1.6">
    <line x1="92" y1="160" x2="930" y2="160"/>
    <line x1="92" y1="208" x2="930" y2="208"/>
    <line x1="92" y1="256" x2="930" y2="256"/>
    <line x1="92" y1="304" x2="930" y2="304"/>
    <line x1="92" y1="352" x2="930" y2="352"/>
    <line x1="92" y1="400" x2="930" y2="400"/>
  </g>
  <g font-size="15" fill="#111827" text-anchor="end">
    <text x="86" y="165">|0⟩</text><text x="86" y="213">|0⟩</text><text x="86" y="261">|0⟩</text>
    <text x="86" y="309">|0⟩</text><text x="86" y="357">|0⟩</text><text x="86" y="405">|0⟩</text>
  </g>

  <!-- encoding gates -->
  <g>
    <rect x="150" y="144" width="66" height="32" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="183" y="166" font-size="13" text-anchor="middle" fill="#1e3a8a">RY(x₀)</text>
    <rect x="150" y="192" width="66" height="32" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="183" y="214" font-size="13" text-anchor="middle" fill="#1e3a8a">RY(x₁)</text>
    <rect x="150" y="240" width="66" height="32" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="183" y="262" font-size="13" text-anchor="middle" fill="#1e3a8a">RY(x₂)</text>
    <rect x="150" y="288" width="66" height="32" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="183" y="310" font-size="13" text-anchor="middle" fill="#1e3a8a">RY(x₃)</text>
    <rect x="150" y="336" width="66" height="32" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="183" y="358" font-size="13" text-anchor="middle" fill="#1e3a8a">RY(x₄)</text>
    <rect x="150" y="384" width="66" height="32" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="183" y="406" font-size="13" text-anchor="middle" fill="#1e3a8a">RY(x₅)</text>
  </g>

  <!-- variational gates: RX RY RZ per qubit -->
  <g>
    <g fill="#fce7f3" stroke="#db2777" stroke-width="1.5">
      <rect x="330" y="144" width="54" height="32" rx="4"/><rect x="396" y="144" width="54" height="32" rx="4"/><rect x="462" y="144" width="54" height="32" rx="4"/>
      <rect x="330" y="192" width="54" height="32" rx="4"/><rect x="396" y="192" width="54" height="32" rx="4"/><rect x="462" y="192" width="54" height="32" rx="4"/>
      <rect x="330" y="240" width="54" height="32" rx="4"/><rect x="396" y="240" width="54" height="32" rx="4"/><rect x="462" y="240" width="54" height="32" rx="4"/>
      <rect x="330" y="288" width="54" height="32" rx="4"/><rect x="396" y="288" width="54" height="32" rx="4"/><rect x="462" y="288" width="54" height="32" rx="4"/>
      <rect x="330" y="336" width="54" height="32" rx="4"/><rect x="396" y="336" width="54" height="32" rx="4"/><rect x="462" y="336" width="54" height="32" rx="4"/>
      <rect x="330" y="384" width="54" height="32" rx="4"/><rect x="396" y="384" width="54" height="32" rx="4"/><rect x="462" y="384" width="54" height="32" rx="4"/>
    </g>
    <g font-size="12" text-anchor="middle" fill="#831843">
      <text x="357" y="166">RX(θ)</text><text x="423" y="166">RY(θ)</text><text x="489" y="166">RZ(θ)</text>
      <text x="357" y="214">RX(θ)</text><text x="423" y="214">RY(θ)</text><text x="489" y="214">RZ(θ)</text>
      <text x="357" y="262">RX(θ)</text><text x="423" y="262">RY(θ)</text><text x="489" y="262">RZ(θ)</text>
      <text x="357" y="310">RX(θ)</text><text x="423" y="310">RY(θ)</text><text x="489" y="310">RZ(θ)</text>
      <text x="357" y="358">RX(θ)</text><text x="423" y="358">RY(θ)</text><text x="489" y="358">RZ(θ)</text>
      <text x="357" y="406">RX(θ)</text><text x="423" y="406">RY(θ)</text><text x="489" y="406">RZ(θ)</text>
    </g>
  </g>

  <!-- CNOT ring -->
  <g stroke="#047857" stroke-width="2" fill="#047857">
    <circle cx="560" cy="160" r="6"/><line x1="560" y1="160" x2="560" y2="208"/><circle cx="560" cy="208" r="11" fill="none"/><line x1="549" y1="208" x2="571" y2="208"/>
    <circle cx="600" cy="208" r="6"/><line x1="600" y1="208" x2="600" y2="256"/><circle cx="600" cy="256" r="11" fill="none"/><line x1="589" y1="256" x2="611" y2="256"/>
    <circle cx="640" cy="256" r="6"/><line x1="640" y1="256" x2="640" y2="304"/><circle cx="640" cy="304" r="11" fill="none"/><line x1="629" y1="304" x2="651" y2="304"/>
    <circle cx="680" cy="304" r="6"/><line x1="680" y1="304" x2="680" y2="352"/><circle cx="680" cy="352" r="11" fill="none"/><line x1="669" y1="352" x2="691" y2="352"/>
    <circle cx="720" cy="352" r="6"/><line x1="720" y1="352" x2="720" y2="400"/><circle cx="720" cy="400" r="11" fill="none"/><line x1="709" y1="400" x2="731" y2="400"/>
  </g>
  <text x="640" y="434" font-size="12" text-anchor="middle" fill="#047857">CNOT ring (nearest-neighbor entanglement)</text>

  <!-- repeat bracket -->
  <path d="M 318 128 L 318 416 M 318 128 L 326 128 M 318 416 L 326 416" stroke="#9d174d" stroke-width="2" fill="none"/>
  <path d="M 752 128 L 752 416 M 752 128 L 744 128 M 752 416 L 744 416" stroke="#9d174d" stroke-width="2" fill="none"/>
  <text x="535" y="124" font-size="14" font-weight="700" text-anchor="middle" fill="#9d174d">× 4 layers  (data re-uploaded in every layer)</text>

  <!-- measurement -->
  <rect x="800" y="144" width="74" height="32" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="837" y="166" font-size="14" text-anchor="middle" font-weight="700" fill="#14532d">⟨Z₀⟩</text>
  <line x1="874" y1="160" x2="930" y2="160" stroke="#16a34a" stroke-width="2"/>

  <!-- output chain -->
  <rect x="300" y="468" width="400" height="48" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="498" font-size="15" font-weight="700" text-anchor="middle" fill="#14532d">⟨Z₀⟩ → 0.8·tanh(2·⟨Z₀⟩) → feed-forward τ_ff</text>

  <!-- stats -->
  <rect x="80" y="536" width="840" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="170" y="560" font-size="13" text-anchor="middle" fill="#475569">Trainable parameters</text>
  <text x="170" y="584" font-size="20" font-weight="700" text-anchor="middle" fill="#0f172a">72</text>
  <text x="357" y="560" font-size="13" text-anchor="middle" fill="#475569">State-vector amplitudes</text>
  <text x="357" y="584" font-size="20" font-weight="700" text-anchor="middle" fill="#0f172a">2⁶ = 64</text>
  <text x="543" y="560" font-size="13" text-anchor="middle" fill="#475569">Memory</text>
  <text x="543" y="584" font-size="20" font-weight="700" text-anchor="middle" fill="#0f172a">512 B</text>
  <text x="730" y="560" font-size="13" text-anchor="middle" fill="#475569">PL core (measured)</text>
  <text x="730" y="584" font-size="20" font-weight="700" text-anchor="middle" fill="#b91c1c">22.5 µs</text>
</svg>
