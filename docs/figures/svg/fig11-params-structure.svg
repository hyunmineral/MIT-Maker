<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="40" font-size="25" font-weight="700" text-anchor="middle" fill="#1a1a2e">Figure 11. Parameter structure: neural network vs. VQC (concept)</text>
  <text x="500" y="66" font-size="14" text-anchor="middle" fill="#6b7280">A neural network grows by multiplication, a VQC by addition</text>

  <rect x="40" y="88" width="450" height="440" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="265" y="120" font-size="19" font-weight="700" text-anchor="middle" fill="#334155">Neural network (MLP)</text>
  <text x="265" y="144" font-size="13" text-anchor="middle" fill="#64748b">Every node connects to every node</text>

