    <line x1="110" y1="295" x2="210" y2="180"/><line x1="110" y1="295" x2="210" y2="215"/><line x1="110" y1="295" x2="210" y2="250"/><line x1="110" y1="295" x2="210" y2="285"/><line x1="110" y1="295" x2="210" y2="320"/>
    <line x1="210" y1="180" x2="310" y2="180"/><line x1="210" y1="180" x2="310" y2="215"/><line x1="210" y1="180" x2="310" y2="250"/><line x1="210" y1="180" x2="310" y2="285"/><line x1="210" y1="180" x2="310" y2="320"/>
    <line x1="210" y1="215" x2="310" y2="180"/><line x1="210" y1="215" x2="310" y2="215"/><line x1="210" y1="215" x2="310" y2="250"/><line x1="210" y1="215" x2="310" y2="285"/><line x1="210" y1="215" x2="310" y2="320"/>
