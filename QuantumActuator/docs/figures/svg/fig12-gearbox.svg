<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="40" font-size="25" font-weight="700" text-anchor="middle" fill="#1a1a2e">Figure 12. Why a reducer? — It trades speed for torque</text>
  <text x="500" y="66" font-size="14" text-anchor="middle" fill="#6b7280">The motor is fast but weak. A robot joint may be slow but must be strong.</text>

  <rect x="50" y="100" width="250" height="230" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="175" y="132" font-size="18" font-weight="700" text-anchor="middle" fill="#92400e">Motor (input side)</text>
  <circle cx="175" cy="196" r="38" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
  <path d="M 175 162 A 34 34 0 1 1 145 213" fill="none" stroke="#f59e0b" stroke-width="5"/>
  <polygon points="140,206 152,216 138,221" fill="#f59e0b"/>
  <text x="175" y="202" font-size="13" font-weight="700" text-anchor="middle" fill="#92400e">Fast</text>
  <text x="175" y="262" font-size="15" text-anchor="middle" fill="#78350f">Speed  <tspan font-weight="700" font-size="17">2,370 rpm</tspan></text>
  <text x="175" y="290" font-size="15" text-anchor="middle" fill="#78350f">Torque  <tspan font-weight="700" font-size="17">1.18 N·m</tspan></text>
  <text x="175" y="314" font-size="12" text-anchor="middle" fill="#a16207">(current 10 A × Kt 0.1176)</text>

  <rect x="340" y="140" width="190" height="150" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="435" y="170" font-size="17" font-weight="700" text-anchor="middle" fill="#3730a3">Cycloidal</text>
  <text x="435" y="192" font-size="17" font-weight="700" text-anchor="middle" fill="#3730a3">reducer</text>
  <text x="435" y="228" font-size="30" font-weight="700" text-anchor="middle" fill="#4f46e5">15 : 1</text>
  <text x="435" y="256" font-size="13" text-anchor="middle" fill="#4338ca">15 input turns</text>
  <text x="435" y="274" font-size="13" text-anchor="middle" fill="#4338ca">= 1 output turn</text>

  <line x1="300" y1="215" x2="340" y2="215" stroke="#374151" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="530" y1="215" x2="570" y2="215" stroke="#374151" stroke-width="3" marker-end="url(#ar)"/>
  <defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs>

  <rect x="570" y="100" width="250" height="230" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="695" y="132" font-size="18" font-weight="700" text-anchor="middle" fill="#14532d">Output shaft</text>
  <circle cx="695" cy="196" r="38" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <path d="M 695 166 A 30 30 0 0 1 723 186" fill="none" stroke="#16a34a" stroke-width="7"/>
  <polygon points="718,180 730,190 716,196" fill="#16a34a"/>
  <text font-size="13" font-weight="700" text-anchor="middle" fill="#14532d"><tspan x="695" y="196">Slow</tspan><tspan x="695" y="212">&amp; strong</tspan></text>
  <text x="695" y="262" font-size="15" text-anchor="middle" fill="#166534">Speed  <tspan font-weight="700" font-size="17">158 rpm</tspan></text>
  <text x="695" y="290" font-size="15" text-anchor="middle" fill="#166534">Torque  <tspan font-weight="700" font-size="17">15.0 N·m</tspan></text>
  <text x="695" y="314" font-size="12" text-anchor="middle" fill="#15803d">(1.18 × 15 × efficiency 0.85)</text>

  <rect x="850" y="140" width="110" height="150" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="905" y="168" font-size="14" font-weight="700" text-anchor="middle" fill="#334155">Change</text>
  <text x="905" y="200" font-size="13" text-anchor="middle" fill="#64748b">Speed</text>
  <text x="905" y="222" font-size="18" font-weight="700" text-anchor="middle" fill="#b91c1c">1/15</text>
  <text x="905" y="252" font-size="13" text-anchor="middle" fill="#64748b">Torque</text>
  <text x="905" y="274" font-size="18" font-weight="700" text-anchor="middle" fill="#16a34a">12.75×</text>

  <rect x="50" y="356" width="910" height="64" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="70" y="382" font-size="15" font-weight="700" fill="#92400e">Why 12.75× and not 15×?</text>
  <text x="70" y="406" font-size="13.5" fill="#78350f">Gear friction turns some force into heat (efficiency). Not measured: trained over 0.75–0.92, nominal 0.85 → 15 × 0.85 = 12.75×.</text>

  <rect x="50" y="436" width="910" height="64" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="70" y="462" font-size="15" font-weight="700" fill="#14532d">Why a cycloidal reducer?</text>
  <text x="70" y="486" font-size="13.5" fill="#166534">Less play (backlash) than ordinary gears and a higher ratio for the same size. In a robot joint even slight backlash hurts control accuracy.</text>
</svg>
