<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="Segoe UI, Malgun Gothic, sans-serif">
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="40" font-size="25" font-weight="700" text-anchor="middle" fill="#1a1a2e">그림 13. 제어는 4개 층으로 나뉘어 있다</text>
  <text x="500" y="66" font-size="14" text-anchor="middle" fill="#6b7280">아래로 갈수록 빠르고 단순하게, 위로 갈수록 느리고 똑똑하게</text>

  <rect x="150" y="96" width="700" height="92" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="180" y="126" font-size="17" font-weight="700" fill="#4c1d95">4층 · 궤적 생성과 감시</text>
  <text x="180" y="150" font-size="13.5" fill="#5b21b6">"관절을 어디로 보낼까?" 목표 각도를 만들고, 이상이 없는지 지켜본다</text>
  <text x="180" y="174" font-size="13" fill="#6d28d9">담당: PYNQ-Z2의 CPU (리눅스)</text>
  <rect x="700" y="112" width="130" height="60" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="765" y="136" font-size="22" font-weight="700" text-anchor="middle" fill="#7c3aed">1 kHz</text>
  <text x="765" y="158" font-size="12" text-anchor="middle" fill="#6d28d9">초당 1,000번</text>

  <rect x="150" y="200" width="700" height="92" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="180" y="230" font-size="17" font-weight="700" fill="#991b1b">3층 · 정책 추론  ← 이 연구의 핵심</text>
  <text x="180" y="254" font-size="13.5" fill="#b91c1c">"지금 상황에서 힘을 얼마나 줄까?" 양자회로(VQC)가 보탤 힘(피드포워드)을 결정한다</text>
  <text x="180" y="278" font-size="13" fill="#dc2626">담당: PYNQ-Z2의 FPGA — 코어 22.5 µs (CPU 준비 포함 29 µs, 실측)</text>
  <rect x="700" y="216" width="130" height="60" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="765" y="240" font-size="22" font-weight="700" text-anchor="middle" fill="#dc2626">1 kHz</text>
  <text x="765" y="262" font-size="12" text-anchor="middle" fill="#b91c1c">초당 1,000번</text>

  <rect x="150" y="304" width="700" height="92" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="180" y="334" font-size="17" font-weight="700" fill="#92400e">2층 · 위치와 속도 맞추기</text>
  <text x="180" y="358" font-size="13.5" fill="#b45309">"목표 각도까지 얼마나 모자라지?" 차이를 줄이도록 전류 목표를 정한다 (PID)</text>
  <text x="180" y="382" font-size="13" fill="#d97706">담당: 모터 제어기 칩 (STM32G431)</text>
  <rect x="700" y="320" width="130" height="60" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="765" y="344" font-size="22" font-weight="700" text-anchor="middle" fill="#d97706">2 kHz</text>
  <text x="765" y="366" font-size="12" text-anchor="middle" fill="#b45309">초당 2,000번</text>

  <rect x="150" y="408" width="700" height="92" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="180" y="438" font-size="17" font-weight="700" fill="#14532d">1층 · FOC 전류 제어</text>
  <text x="180" y="462" font-size="13.5" fill="#166534">"3개 전선에 각각 전류를 얼마나 흘릴까?" 모터를 실제로 돌리는 가장 밑바닥 계산</text>
  <text x="180" y="486" font-size="13" fill="#15803d">담당: 모터 제어기 칩 (STM32G431)</text>
  <rect x="700" y="424" width="130" height="60" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="765" y="448" font-size="22" font-weight="700" text-anchor="middle" fill="#16a34a">10 kHz</text>
  <text x="765" y="470" font-size="12" text-anchor="middle" fill="#15803d">초당 10,000번</text>

  <line x1="110" y1="110" x2="110" y2="490" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ad)"/>
  <defs><marker id="ad" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#94a3b8"/></marker></defs>
  <text x="76" y="300" font-size="14" font-weight="700" text-anchor="middle" fill="#64748b" transform="rotate(-90 76 300)">점점 빨라짐</text>

  <rect x="50" y="520" width="910" height="80" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="546" font-size="15" font-weight="700" fill="#0f172a">왜 FOC를 FPGA로 옮기지 않았을까?</text>
  <text x="70" y="570" font-size="13.5" fill="#334155">FOC는 이미 모터 제어기 칩에서 초당 1만 번 안정적으로 돌고 있다. 잘 돌아가는 것을 굳이 옮기면 얻는 것 없이 고장 위험만 생긴다.</text>
  <text x="70" y="592" font-size="13.5" fill="#334155">그래서 FPGA에는 &quot;정책 추론&quot;이라는 새로운 일만 맡겼다. 각자 잘하는 일을 시키는 역할 분담이다.</text>
</svg>
