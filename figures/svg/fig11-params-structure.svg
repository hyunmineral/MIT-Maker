<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="Segoe UI, Malgun Gothic, sans-serif">
  <rect width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="40" font-size="25" font-weight="700" text-anchor="middle" fill="#1a1a2e">그림 11. 신경망과 VQC의 파라미터 구조 (개념도)</text>
  <text x="500" y="66" font-size="14" text-anchor="middle" fill="#6b7280">신경망은 곱셈으로 늘고, VQC는 덧셈으로 는다</text>

  <rect x="40" y="88" width="450" height="440" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="265" y="120" font-size="19" font-weight="700" text-anchor="middle" fill="#334155">신경망 (MLP)</text>
  <text x="265" y="144" font-size="13" text-anchor="middle" fill="#64748b">모든 점이 모든 점과 연결된다</text>

  <g stroke="#cbd5e1" stroke-width="0.7" opacity="0.65">
    <line x1="110" y1="190" x2="210" y2="180"/><line x1="110" y1="190" x2="210" y2="215"/><line x1="110" y1="190" x2="210" y2="250"/><line x1="110" y1="190" x2="210" y2="285"/><line x1="110" y1="190" x2="210" y2="320"/>
    <line x1="110" y1="225" x2="210" y2="180"/><line x1="110" y1="225" x2="210" y2="215"/><line x1="110" y1="225" x2="210" y2="250"/><line x1="110" y1="225" x2="210" y2="285"/><line x1="110" y1="225" x2="210" y2="320"/>
    <line x1="110" y1="260" x2="210" y2="180"/><line x1="110" y1="260" x2="210" y2="215"/><line x1="110" y1="260" x2="210" y2="250"/><line x1="110" y1="260" x2="210" y2="285"/><line x1="110" y1="260" x2="210" y2="320"/>
    <line x1="110" y1="295" x2="210" y2="180"/><line x1="110" y1="295" x2="210" y2="215"/><line x1="110" y1="295" x2="210" y2="250"/><line x1="110" y1="295" x2="210" y2="285"/><line x1="110" y1="295" x2="210" y2="320"/>
    <line x1="210" y1="180" x2="310" y2="180"/><line x1="210" y1="180" x2="310" y2="215"/><line x1="210" y1="180" x2="310" y2="250"/><line x1="210" y1="180" x2="310" y2="285"/><line x1="210" y1="180" x2="310" y2="320"/>
    <line x1="210" y1="215" x2="310" y2="180"/><line x1="210" y1="215" x2="310" y2="215"/><line x1="210" y1="215" x2="310" y2="250"/><line x1="210" y1="215" x2="310" y2="285"/><line x1="210" y1="215" x2="310" y2="320"/>
    <line x1="210" y1="250" x2="310" y2="180"/><line x1="210" y1="250" x2="310" y2="215"/><line x1="210" y1="250" x2="310" y2="250"/><line x1="210" y1="250" x2="310" y2="285"/><line x1="210" y1="250" x2="310" y2="320"/>
    <line x1="210" y1="285" x2="310" y2="180"/><line x1="210" y1="285" x2="310" y2="215"/><line x1="210" y1="285" x2="310" y2="250"/><line x1="210" y1="285" x2="310" y2="285"/><line x1="210" y1="285" x2="310" y2="320"/>
    <line x1="210" y1="320" x2="310" y2="180"/><line x1="210" y1="320" x2="310" y2="215"/><line x1="210" y1="320" x2="310" y2="250"/><line x1="210" y1="320" x2="310" y2="285"/><line x1="210" y1="320" x2="310" y2="320"/>
    <line x1="310" y1="180" x2="410" y2="250"/><line x1="310" y1="215" x2="410" y2="250"/><line x1="310" y1="250" x2="410" y2="250"/><line x1="310" y1="285" x2="410" y2="250"/><line x1="310" y1="320" x2="410" y2="250"/>
  </g>
  <g fill="#94a3b8">
    <circle cx="110" cy="190" r="9"/><circle cx="110" cy="225" r="9"/><circle cx="110" cy="260" r="9"/><circle cx="110" cy="295" r="9"/>
    <circle cx="210" cy="180" r="9"/><circle cx="210" cy="215" r="9"/><circle cx="210" cy="250" r="9"/><circle cx="210" cy="285" r="9"/><circle cx="210" cy="320" r="9"/>
    <circle cx="310" cy="180" r="9"/><circle cx="310" cy="215" r="9"/><circle cx="310" cy="250" r="9"/><circle cx="310" cy="285" r="9"/><circle cx="310" cy="320" r="9"/>
  </g>
  <circle cx="410" cy="250" r="11" fill="#64748b"/>
  <g font-size="12" fill="#64748b" text-anchor="middle">
    <text x="110" y="350">입력 8</text><text x="210" y="350">은닉 64</text><text x="310" y="350">은닉 64</text><text x="410" y="282">출력 1</text>
  </g>

  <rect x="70" y="372" width="390" height="134" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="90" y="396" font-size="14" font-weight="700" fill="#334155">파라미터 계산</text>
  <text x="90" y="420" font-size="13" fill="#475569">8 × 64 + 64 = 576</text>
  <text x="90" y="442" font-size="13" font-weight="700" fill="#b91c1c">64 × 64 + 64 = 4,160  ← 여기서 폭증</text>
  <text x="90" y="464" font-size="13" fill="#475569">64 × 1 + 1 = 65</text>
  <line x1="90" y1="474" x2="440" y2="474" stroke="#cbd5e1"/>
  <text x="90" y="496" font-size="17" font-weight="700" fill="#334155">합계 4,801개</text>

  <rect x="510" y="88" width="450" height="440" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="735" y="120" font-size="19" font-weight="700" text-anchor="middle" fill="#3730a3">양자회로 (VQC)</text>
  <text x="735" y="144" font-size="13" text-anchor="middle" fill="#4f46e5">선마다 다이얼 3개씩만 붙는다</text>

  <g stroke="#475569" stroke-width="1.5">
    <line x1="548" y1="180" x2="922" y2="180"/><line x1="548" y1="208" x2="922" y2="208"/><line x1="548" y1="236" x2="922" y2="236"/>
    <line x1="548" y1="264" x2="922" y2="264"/><line x1="548" y1="292" x2="922" y2="292"/><line x1="548" y1="320" x2="922" y2="320"/>
  </g>
  <g fill="#fce7f3" stroke="#db2777" stroke-width="1.2">
    <rect x="580" y="170" width="26" height="20" rx="3"/><rect x="612" y="170" width="26" height="20" rx="3"/><rect x="644" y="170" width="26" height="20" rx="3"/>
    <rect x="580" y="198" width="26" height="20" rx="3"/><rect x="612" y="198" width="26" height="20" rx="3"/><rect x="644" y="198" width="26" height="20" rx="3"/>
    <rect x="580" y="226" width="26" height="20" rx="3"/><rect x="612" y="226" width="26" height="20" rx="3"/><rect x="644" y="226" width="26" height="20" rx="3"/>
    <rect x="580" y="254" width="26" height="20" rx="3"/><rect x="612" y="254" width="26" height="20" rx="3"/><rect x="644" y="254" width="26" height="20" rx="3"/>
    <rect x="580" y="282" width="26" height="20" rx="3"/><rect x="612" y="282" width="26" height="20" rx="3"/><rect x="644" y="282" width="26" height="20" rx="3"/>
    <rect x="580" y="310" width="26" height="20" rx="3"/><rect x="612" y="310" width="26" height="20" rx="3"/><rect x="644" y="310" width="26" height="20" rx="3"/>
  </g>
  <g stroke="#047857" stroke-width="1.6" fill="#047857">
    <circle cx="700" cy="180" r="4"/><line x1="700" y1="180" x2="700" y2="208"/><circle cx="700" cy="208" r="7" fill="none"/>
    <circle cx="724" cy="208" r="4"/><line x1="724" y1="208" x2="724" y2="236"/><circle cx="724" cy="236" r="7" fill="none"/>
    <circle cx="748" cy="236" r="4"/><line x1="748" y1="236" x2="748" y2="264"/><circle cx="748" cy="264" r="7" fill="none"/>
    <circle cx="772" cy="264" r="4"/><line x1="772" y1="264" x2="772" y2="292"/><circle cx="772" cy="292" r="7" fill="none"/>
    <circle cx="796" cy="292" r="4"/><line x1="796" y1="292" x2="796" y2="320"/><circle cx="796" cy="320" r="7" fill="none"/>
  </g>
  <text x="624" y="350" font-size="12" text-anchor="middle" fill="#9d174d">회전 3개 × 큐빗 6개</text>
  <text x="748" y="350" font-size="12" text-anchor="middle" fill="#047857">CNOT (파라미터 없음)</text>
  <path d="M 566 164 L 566 336 M 566 164 L 572 164 M 566 336 L 572 336" stroke="#9d174d" stroke-width="1.8" fill="none"/>
  <path d="M 904 164 L 904 336 M 904 164 L 898 164 M 904 336 L 898 336" stroke="#9d174d" stroke-width="1.8" fill="none"/>
  <text x="735" y="160" font-size="13" font-weight="700" text-anchor="middle" fill="#9d174d">× 4 레이어</text>

  <rect x="540" y="372" width="390" height="134" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="560" y="396" font-size="14" font-weight="700" fill="#3730a3">파라미터 계산</text>
  <text x="560" y="424" font-size="14" fill="#4338ca">큐빗 6 × 회전축 3 × 레이어 4</text>
  <text x="560" y="452" font-size="13" fill="#64748b">CNOT에는 학습 파라미터가 없음</text>
  <line x1="560" y1="470" x2="910" y2="470" stroke="#c7d2fe"/>
  <text x="560" y="496" font-size="17" font-weight="700" fill="#4f46e5">합계 72개</text>

  <rect x="40" y="546" width="920" height="92" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="576" font-size="18" font-weight="700" text-anchor="middle" fill="#14532d">주의: 같은 입력의 작은 신경망(6-8-1)은 65개 — 실측 비교에선 VQC보다 정확</text>
  <text x="500" y="602" font-size="14" text-anchor="middle" fill="#166534">신경망은 층과 층 사이가 &quot;64 × 64&quot; 처럼 곱셈으로 늘어나지만,</text>
  <text x="500" y="624" font-size="14" text-anchor="middle" fill="#166534">VQC는 &quot;6 × 3 × 4&quot; 처럼 작은 수들의 곱이라 훨씬 천천히 늘어난다</text>
</svg>
