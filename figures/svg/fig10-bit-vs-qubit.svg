<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="Segoe UI, Malgun Gothic, sans-serif">
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="40" font-size="25" font-weight="700" text-anchor="middle" fill="#1a1a2e">그림 10. 비트와 큐빗의 차이</text>
  <text x="500" y="66" font-size="14" text-anchor="middle" fill="#6b7280">스위치 하나 vs 다이얼 하나</text>

  <rect x="50" y="90" width="430" height="300" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="265" y="124" font-size="19" font-weight="700" text-anchor="middle" fill="#334155">보통 컴퓨터 — 비트 (bit)</text>
  <text x="265" y="150" font-size="14" text-anchor="middle" fill="#64748b">전등 스위치처럼 둘 중 하나</text>

  <rect x="110" y="178" width="120" height="86" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="170" cy="210" r="18" fill="#cbd5e1"/>
  <text x="170" y="252" font-size="20" font-weight="700" text-anchor="middle" fill="#475569">0</text>
  <text x="170" y="284" font-size="13" text-anchor="middle" fill="#64748b">꺼짐</text>

  <rect x="300" y="178" width="120" height="86" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="360" cy="210" r="18" fill="#fbbf24"/>
  <text x="360" y="252" font-size="20" font-weight="700" text-anchor="middle" fill="#b45309">1</text>
  <text x="360" y="284" font-size="13" text-anchor="middle" fill="#92400e">켜짐</text>

  <text x="265" y="324" font-size="15" text-anchor="middle" fill="#334155">중간은 없다. 반드시 0 아니면 1.</text>
  <rect x="100" y="340" width="330" height="36" rx="6" fill="#e2e8f0"/>
  <text x="265" y="364" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">비트 n개 → 상태 n개를 따로 저장</text>

  <rect x="520" y="90" width="430" height="300" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="735" y="124" font-size="19" font-weight="700" text-anchor="middle" fill="#3730a3">양자 — 큐빗 (qubit)</text>
  <text x="735" y="150" font-size="14" text-anchor="middle" fill="#4f46e5">다이얼처럼 각도로 정해짐</text>

  <circle cx="735" cy="250" r="72" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
  <line x1="735" y1="250" x2="735" y2="178" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="735" y1="250" x2="807" y2="250" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="735" y1="250" x2="786" y2="199" stroke="#4f46e5" stroke-width="4"/>
  <circle cx="786" cy="199" r="7" fill="#4f46e5"/>
  <path d="M 765 250 A 30 30 0 0 0 757 229" fill="none" stroke="#db2777" stroke-width="2.5"/>
  <text x="776" y="247" font-size="15" font-weight="700" fill="#db2777">θ</text>
  <text x="735" y="168" font-size="14" font-weight="700" text-anchor="middle" fill="#475569">|1⟩</text>
  <text x="824" y="256" font-size="14" font-weight="700" fill="#475569">|0⟩</text>

  <text x="735" y="352" font-size="15" text-anchor="middle" fill="#3730a3">각도 θ 하나로 0과 1의 비율이 정해진다</text>
  <rect x="570" y="340" width="330" height="36" rx="6" fill="#ffffff" opacity="0"/>
  <text x="735" y="376" font-size="14" text-anchor="middle" font-weight="700" fill="#4338ca">이 "섞인 상태"를 중첩(superposition)이라 한다</text>

  <text x="500" y="432" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a2e">큐빗이 늘어나면 다룰 수 있는 숫자가 2배씩 늘어난다</text>

  <g font-size="15">
    <rect x="120" y="452" width="760" height="38" fill="#1a1a2e"/>
    <text x="220" y="477" font-weight="700" text-anchor="middle" fill="#ffffff">큐빗 수</text>
    <text x="470" y="477" font-weight="700" text-anchor="middle" fill="#ffffff">다룰 수 있는 숫자의 개수</text>
    <text x="760" y="477" font-weight="700" text-anchor="middle" fill="#ffffff">비유</text>

    <rect x="120" y="490" width="760" height="30" fill="#ffffff"/>
    <text x="220" y="511" text-anchor="middle" fill="#334155">1개</text>
    <text x="470" y="511" text-anchor="middle" fill="#334155">2¹ = 2개</text>
    <text x="760" y="511" text-anchor="middle" fill="#64748b">—</text>

    <rect x="120" y="520" width="760" height="30" fill="#f8fafc"/>
    <text x="220" y="541" text-anchor="middle" fill="#334155">3개</text>
    <text x="470" y="541" text-anchor="middle" fill="#334155">2³ = 8개</text>
    <text x="760" y="541" text-anchor="middle" fill="#64748b">—</text>

    <rect x="120" y="550" width="760" height="32" fill="#eef2ff"/>
    <text x="220" y="572" font-weight="700" text-anchor="middle" fill="#4f46e5">6개 (이 연구)</text>
    <text x="470" y="572" font-weight="700" text-anchor="middle" fill="#4f46e5">2⁶ = 64개</text>
    <text x="760" y="572" text-anchor="middle" fill="#4338ca">조종 손잡이는 72개뿐</text>

    <rect x="120" y="582" width="760" height="30" fill="#ffffff"/>
    <text x="220" y="603" text-anchor="middle" fill="#334155">10개</text>
    <text x="470" y="603" text-anchor="middle" fill="#334155">2¹⁰ = 1,024개</text>
    <text x="760" y="603" text-anchor="middle" fill="#b91c1c">너무 느려짐 (250 µs)</text>
  </g>
  <rect x="120" y="452" width="760" height="160" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
</svg>
